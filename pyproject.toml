[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "possession"
version = "1.0.0"
description = "Frame-level ball possession (H / A / D) for More than a Hack 2027, Phase 1"
requires-python = "==3.14.*"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.4,<2.5",
    "pandas>=3.0,<3.1",
    "scipy>=1.18,<1.19",
    "scikit-learn>=1.9,<1.10",
    "numba>=0.68,<0.69",
    "threadpoolctl>=3.7",
    "joblib>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[tool.setuptools.packages.find]
where = ["lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lib"]
